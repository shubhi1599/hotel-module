services:
  backend:
    build:
      context: .
    container_name: globinn-hotel-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-globinn}:${POSTGRES_PASSWORD:-globinn}@postgres:5432/${POSTGRES_DB:-globinn_hotels}
      REDIS_URL: redis://redis:6379
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    container_name: globinn-hotel-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-globinn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globinn}
      POSTGRES_DB: ${POSTGRES_DB:-globinn_hotels}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: globinn-hotel-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
